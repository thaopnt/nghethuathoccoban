<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tra Điểm GPD1135 A01</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Parkinsans:wght@700&display=swap">
<style>
:root{--bg:#F8F6F3;--card:#fff;--fg:#1A1310;--body:#3A2E26;--mut:#6B5D52;--line:#E5DFD0;--soft:#F3EEE3;--red:#A81C24;--gold:#C9A24E;--goldt:#86661C;--teal:#0E8C71;--tealt:#0A7860;--cam:#C9622A;--camt:#B04E18;--blu:#3A7A9A;--blut:#2E6683;--pur:#6A4A9A;--purt:#5C3E8A;--bad:#9A3412;--onbtn:#fff;--hbg:#130607;--hfg:#F2E6D8;--hsub:#D9CCC0;--ring:#3A7A9A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#130607;--card:#1F0F11;--fg:#F2E6D8;--body:#D9CCC0;--mut:#A89A8C;--line:#3A2427;--soft:#2A1A1C;--red:#E0525A;--gold:#D8B565;--goldt:#D8B565;--teal:#3BBE9E;--tealt:#3BBE9E;--cam:#E58A52;--camt:#E58A52;--blu:#6FB0D0;--blut:#6FB0D0;--pur:#A98BD8;--purt:#A98BD8;--bad:#F0A27A;--onbtn:#130607;--ring:#6FB0D0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#130607;--card:#1F0F11;--fg:#F2E6D8;--body:#D9CCC0;--mut:#A89A8C;--line:#3A2427;--soft:#2A1A1C;--red:#E0525A;--gold:#D8B565;--goldt:#D8B565;--teal:#3BBE9E;--tealt:#3BBE9E;--cam:#E58A52;--camt:#E58A52;--blu:#6FB0D0;--blut:#6FB0D0;--pur:#A98BD8;--purt:#A98BD8;--bad:#F0A27A;--onbtn:#130607;--ring:#6FB0D0;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--body);font-family:Montserrat,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 0}
h1,h2,h3,.hd{font-family:Parkinsans,"1FTV VIP Parkinsans",Montserrat,sans-serif;font-weight:700;color:var(--fg)}
.band{margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));background:var(--hbg);border-bottom:4px solid #CD181D}
.band>div{max-width:860px;margin:0 auto;padding:18px 0;display:flex;align-items:center;gap:16px}
.band img{width:58px;height:auto;flex:none}
.band .tx{min-width:0}
.badge{display:inline-block;background:var(--gold);color:#1A1310;font-weight:700;font-size:.7rem;letter-spacing:.06em;padding:2px 10px;border-radius:5px;margin-bottom:4px}
.band h1{margin:0;color:var(--hfg);font-size:1.45rem;line-height:1.25;text-wrap:balance}
.band p{margin:2px 0 0;color:var(--hsub);font-size:.82rem}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-block:20px 24px}
.search{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:10px;padding:16px 18px;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.search .f{flex:1 1 240px;min-width:0}.search label{display:block;font-size:.85rem;font-weight:600;margin-bottom:5px;color:var(--fg)}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px}
button{font:inherit;font-weight:600;padding:10px 24px;background:var(--red);color:#fff;border:0;cursor:pointer;border-radius:8px}
:root[data-theme="dark"] button.go{color:#130607}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.go{color:#130607}}
button:hover{opacity:.9}input:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.msg{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:14px 18px;color:var(--mut)}
.pick{display:flex;flex-direction:column;gap:6px;margin-top:6px}.pick button{text-align:left;background:var(--bg);color:var(--fg);border:1px solid var(--line);font-weight:500}
.who{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 20px}
.who h2{margin:0;font-size:1.3rem}.who p{margin:2px 0 0;color:var(--mut);font-size:.85rem}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.col{all:unset;box-sizing:border-box;cursor:pointer;display:block;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:10px;padding:14px 16px;min-width:0;color:var(--body);font-family:inherit}
.col:hover{border-color:var(--c)}
.col:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.col.on{box-shadow:0 0 0 2px var(--c);background:var(--card)}
.col .lb{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.85rem;color:var(--ct)}
.col svg{width:20px;height:20px;flex:none}
.col .num{font-family:Parkinsans,"1FTV VIP Parkinsans",Montserrat,sans-serif;font-weight:700;font-size:2.7rem;line-height:1.1;color:var(--fg);font-variant-numeric:tabular-nums;margin-top:6px}
.col .num span{font-family:Montserrat,sans-serif;font-weight:500;font-size:1rem;color:var(--mut)}
.col .sub{font-size:.78rem;color:var(--mut)}
.col .see{display:block;margin-top:6px;font-size:.78rem;font-weight:600;color:var(--ct)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:10px;padding:10px 14px}
.tile small{display:flex;align-items:center;gap:6px;color:var(--ct);font-weight:600;font-size:.78rem}
.tile svg{width:16px;height:16px;flex:none}
.tile b{font-family:Parkinsans,"1FTV VIP Parkinsans",Montserrat,sans-serif;font-size:1.5rem;color:var(--fg);font-variant-numeric:tabular-nums}.tile span{color:var(--mut);font-size:.85rem}
.sec{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:10px;overflow:hidden}
.sec>h3{margin:0;padding:12px 18px;display:flex;justify-content:space-between;gap:12px;font-size:1rem;border-bottom:1px solid var(--line)}
.sec>h3 em{font-style:normal;color:var(--ct);font-variant-numeric:tabular-nums;white-space:nowrap}
.it{padding:12px 18px;border-top:1px solid var(--line);display:grid;grid-template-columns:2.8rem minmax(0,1fr) auto;gap:3px 10px;align-items:baseline}
.it:first-of-type{border-top:0}
.it .cd{font-weight:700;color:var(--ct)}.it .nm{font-weight:600;color:var(--fg)}.it .sc{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--fg)}
.it .ds,.it .q{display:block;font-weight:400;font-size:.8rem;color:var(--mut);margin-top:2px}
.it .q{grid-column:2/4;font-style:italic;margin:0}.it .q b{font-style:normal;color:var(--body)}
.it .fb{grid-column:2/4;font-size:.88rem;color:var(--body)}.it.lost .fb{color:var(--bad)}.it.lost .sc{font-weight:700}
.it .cap{grid-column:2/4;font-size:.8rem;color:var(--bad)}
details{grid-column:2/4;font-size:.8rem;color:var(--mut)}details summary{cursor:pointer;font-weight:600;color:var(--ct)}
details ol{margin:6px 0 0;padding-left:1.2rem}details li{margin:3px 0}details li.on{color:var(--fg);font-weight:700}
.cm{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:10px;padding:16px 20px}
.cm h3{margin:0 0 8px;font-size:1rem}.cm p{margin:0;text-wrap:pretty}
.topic{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:14px 20px;font-size:.9rem}.topic ul{margin:6px 0 0;padding-left:1.2rem}
.pres{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--cam);border-radius:10px;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.pres b{font-family:Parkinsans,"1FTV VIP Parkinsans",Montserrat,sans-serif;font-size:1.5rem;color:var(--fg);font-variant-numeric:tabular-nums}.pres small{display:block;color:var(--mut);font-size:.8rem}
.sum{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:14px 20px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums;color:var(--fg)}
.legend{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 20px;font-size:.82rem;color:var(--mut)}.legend b{color:var(--fg)}
.note{font-size:.78rem;color:var(--mut);text-align:center;margin:0}
.foot{margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:6px max(16px,env(safe-area-inset-left,0px));background:#CD181D;color:#fff;font-size:.7rem;text-align:left}
.foot div{max-width:860px;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:16px}
@media (max-width:560px){.tiles{grid-template-columns:1fr}.it{grid-template-columns:2.4rem minmax(0,1fr) auto}.col .num{font-size:2.2rem}.band h1{font-size:1.2rem}.band img{width:48px}}
</style>
</head>

var D={"255121984":{"name":"Nguyễn Thanh Vy","it":[{"c":"TC1","n":"Trải nghiệm cá nhân","s":0.5,"f":"Lý do chọn tác phẩm còn khá chung, em nên thêm điều riêng khiến em chọn đúng tác phẩm này; cảm xúc bản thân ở Phần 2 không nêu rõ là cảm xúc gì, chỉ mô tả hiệu ứng thị giác"},{"c":"TC2","n":"Yếu tố nghệ thuật và dẫn chứng","s":1,"f":"Nêu dẫn chứng cụ thể từ cả 4 hình: màu sắc, tương phản, ánh sáng"},{"c":"TC3","n":"Giải thích tác động","s":0.5,"f":"Có giải thích tác động nhưng còn hời hợt: dừng ở “tạo cảm xúc”, không nói rõ cảm xúc gì và vì sao yếu tố đó tạo ra cảm xúc ấy"},{"c":"TC4","n":"Nhận xét và góc nhìn riêng","s":0.5,"f":"Chưa có nhận định, đánh giá hay so sánh với tác phẩm khác, chưa có lập trường riêng (“theo em…”); mới dừng ở mô tả"},{"c":"TC5","n":"Vận dụng kiến thức","s":0.75,"f":"Vận dụng tốt khái niệm cơ bản (màu sắc, ánh sáng, chuyển động, âm nhạc) nhưng chưa nhắc góc máy, cách dựng (montage), nhịp điệu cảnh"},{"c":"TC6","n":"Sự kết hợp trong tác phẩm","s":0.5,"f":"Có liệt kê các yếu tố và câu khái quát “không hoạt động riêng lẻ” nhưng không chỉ rõ yếu tố nào bổ sung cho yếu tố nào, không liên hệ lại hình cụ thể: vẫn dừng ở liệt kê"},{"c":"TC7","n":"Nhận thức đa loại hình","s":0.5,"f":"Có nhắc loại hình khác nhưng sơ lược"},{"c":"TC8","n":"Cấu trúc và độ dài","s":1.0,"f":"Đủ 3 phần; thể loại đã nêu (hoạt hình) trong lý do chọn"},{"c":"TC9","n":"Hình ảnh và nguồn","s":1,"f":"Đủ số, chú thích, nguồn, danh mục hình"},{"c":"TC10","n":"Trình bày và định dạng","s":1,"f":"Bìa, mục lục, danh mục hình đủ và đúng; bố cục rõ ràng, ổn. Chú thích Hình 1, 2 còn vụng nhưng ít ảnh hưởng hình thức tổng thể"}],"sa":2.5,"sb":1.75,"sc":3.0,"fin":7.25,"fb":"Em trình bày bài rất chỉn chu: bìa, mục lục và danh mục hình đầy đủ, bố cục rõ ràng, chỉ có chú thích Hình 1 và Hình 2 em nên viết lại cho gọn và rõ nghĩa hơn. Phần quan sát màu sắc, tương phản và ánh sáng qua cả bốn hình là điểm mạnh của bài, có dẫn chứng cụ thể. Điều em cần cải thiện trước hết là tiếng nói cá nhân: lý do chọn tác phẩm còn khá chung, em hãy thêm một điều riêng khiến em chọn đúng tác phẩm này, và ở Phần 2 em mới mô tả hiệu ứng thị giác chứ chưa nói rõ mình đã cảm thấy gì (căng thẳng, bất an, phấn khích…) và vì sao yếu tố đó khiến em có cảm xúc ấy. Em cũng nên mạnh dạn đưa ra nhận định riêng, chẳng hạn so sánh với một tác phẩm khác em từng xem hoặc nêu điều em thấy hiệu quả và chưa hiệu quả. Ở Phần 3, em liệt kê được nhiều yếu tố (bố cục, ánh sáng, màu sắc, âm nhạc, chuyển động, tạo hình nhân vật) và nhận ra chúng không hoạt động riêng lẻ, nhưng chưa chỉ ra yếu tố nào bổ sung cho yếu tố nào; em thử quay lại một hình cụ thể để phân tích sự phối hợp đó, và bổ sung các khái niệm điện ảnh như góc máy, cách dựng, nhịp điệu cảnh. Cố gắng thêm một chút nữa là bài của em sẽ rất tốt."},"235125462":{"name":"Phạm Minh Phú Khang","it":[{"c":"TC1","n":"Trải nghiệm cá nhân","s":0.75,"f":"Có chi tiết cá nhân, khá thuyết phục"},{"c":"TC2","n":"Yếu tố nghệ thuật và dẫn chứng","s":0.75,"f":"Có phân tích yếu tố nghệ thuật (màu sắc, phong cách hình ảnh) nhưng một số đoạn phân tích không khớp với hình minh họa đi kèm - ví dụ mô tả một cảnh cụ thể (như cảnh mở đầu phim) nhưng không có hình minh họa tương ứng cho cảnh đó, khiến phần mô tả và hình ảnh không đồng bộ."},{"c":"TC3","n":"Giải thích tác động","s":0.75,"f":"Nối được yếu tố nghệ thuật với cảm xúc"},{"c":"TC4","n":"Nhận xét và góc nhìn riêng","s":0.75,"f":"Có góc nhìn riêng nhưng chưa thật sâu"},{"c":"TC5","n":"Vận dụng kiến thức","s":0.75,"f":"Dùng khái niệm đúng và hợp ngữ cảnh"},{"c":"TC6","n":"Sự kết hợp trong tác phẩm","s":1.0,"f":"Phân tích rất tốt sự phối hợp hình, nhạc, kể chuyện"},{"c":"TC7","n":"Nhận thức đa loại hình","s":1.0,"f":"Liên hệ hội hoạ, truyện tranh, âm nhạc tốt"},{"c":"TC8","n":"Cấu trúc và độ dài","s":1.0,"f":"Đủ 3 phần, độ dài hợp lý"},{"c":"TC9","n":"Hình ảnh và nguồn","s":0.5,"f":"Hình 2 và Hình 3 thực chất là tranh fan art (vẽ theo phong cách màu nước và cắt dán, nguồn từ Reddit của người hâm mộ), không phải là cảnh/khung hình thật lấy từ phim, nhưng được chú thích như thể là nội dung trong phim. Chỉ Hình 1 là poster chính thức, đúng nguồn."},{"c":"TC10","n":"Trình bày và định dạng","s":0.75,"f":"Danh mục hình và tài liệu tham khảo trình bày chưa gọn, không đồng nhất kiểu trích dẫn. Xưng hô lúc “mình” lúc “em”."}],"sa":3.0,"sb":2.75,"sc":2.25,"fin":8.0,"fb":"Bài của em có độ dài phù hợp yêu cầu, phân tích màu sắc và phong cách hình ảnh khá tốt, và phần liên hệ ở Phần 3 có ví dụ cụ thể (màu sắc thay đổi kéo theo nhạc thay đổi để phân biệt các vũ trụ) chứ không chỉ liệt kê, đây là điểm mạnh em nên giữ. Điều em cần cải thiện trước hết là tiếng nói cá nhân: câu “lần xem ở rạp CGV đã để lại ấn tượng” còn chung chung, em hãy thêm chi tiết riêng (xem cùng ai, khoảnh khắc nào khiến em nhớ nhất) để người đọc cảm nhận được đây là trải nghiệm của riêng em. Một số đoạn em mô tả cảnh cụ thể (như cảnh mở đầu phim) nhưng không có hình minh họa tương ứng, nên chữ và hình chưa đồng bộ; mỗi chi tiết được phân tích nên đi kèm một hình đúng cảnh đó. Về hình ảnh, Hình 2 và Hình 3 thực chất là tranh người hâm mộ (fan art) lấy từ Reddit nhưng lại được chú thích như cảnh trong phim; khi dùng hình không phải lấy trực tiếp từ tác phẩm, em cần ghi rõ bản chất và nguồn của hình. Về trình bày, danh mục hình và tài liệu tham khảo của em còn chưa gọn và chưa đồng nhất kiểu trích dẫn; em cũng cần thống nhất cách xưng hô xuyên suốt bài (hiện lúc dùng “mình”, lúc dùng “em”). Em chỉnh những điểm này thì bài sẽ hoàn thiện hơn nhiều."},"255172989":{"name":"Mạnh Dương Triệu","it":[{"c":"TC1","n":"Trải nghiệm cá nhân","s":1,"f":"Có chi tiết cá nhân rõ (lý do chọn phim, cảm nhận riêng ở từng giai đoạn) và có ảnh tự chụp hợp lý (Hình 2 - không gian thưởng thức)."},{"c":"TC2","n":"Yếu tố nghệ thuật và dẫn chứng","s":0.5,"f":"Thiếu phân tích về điện ảnh dù đây là tác phẩm điện ảnh - loại hình trung tâm của bài, trong khi hội họa và âm nhạc được phân tích khá chi tiết."},{"c":"TC3","n":"Giải thích tác động","s":1.0,"f":"Giải thích tác động cảm xúc rất tốt"},{"c":"TC4","n":"Nhận xét và góc nhìn riêng","s":1,"f":"Có góc nhìn riêng xuyên suốt bài: trân trọng nét vẽ tay truyền thống giữa thời đại điện ảnh lạm dụng công nghệ, nhắc lại nhất quán ở Phần 1 và Phần 2."},{"c":"TC5","n":"Vận dụng kiến thức","s":1,"f":"Vận dụng khá đầy đủ, chính xác kiến thức học phần: nêu đúng ba loại hình (hội họa, âm nhạc, điện ảnh) kèm thuật ngữ cụ thể (Emakimono, đàn Koto)."},{"c":"TC6","n":"Sự kết hợp trong tác phẩm","s":1,"f":"Mô tả cụ thể, chi tiết sự kết hợp hình ảnh - màu sắc - âm nhạc thay đổi theo từng giai đoạn phim (thơ ấu, kinh thành, cao trào)."},{"c":"TC7","n":"Nhận thức đa loại hình","s":0.75,"f":"Nêu được ba loại hình kết hợp với nhau nhưng đặt ngang hàng, chưa nêu rõ được điện ảnh là loại hình trung tâm, các loại hình còn lại đóng vai trò bổ trợ."},{"c":"TC8","n":"Cấu trúc và độ dài","s":1,"f":"Phần 1 khoảng 107 từ, Phần 2 (trọng tâm) khoảng 461 từ, Phần 3 khoảng 249 từ, tổng khoảng 817 từ - nằm trong khoảng cho phép 540-880 từ (xê xích 10% mốc 600-800), lệch nhẹ ở Phần 2 không đáng kể."},{"c":"TC9","n":"Hình ảnh và nguồn","s":0.75,"f":"Có đủ hình minh họa cho các phần và có ảnh tự chụp; nhưng các hình chụp từ phim (Hình 3, 4, 5) không ghi nguồn (cảnh nào, xem trên nền tảng nào) và bài không có danh mục hình dù dùng từ 3 hình trở lên"},{"c":"TC10","n":"Trình bày và định dạng","s":0.5,"f":"Bìa ghi sai tiêu đề “Bài thu hoạch giữa kỳ” (đề yêu cầu “Bài thu hoạch cá nhân”) và còn vài lỗi chính tả/diễn đạt"}],"sa":3.5,"sb":2.75,"sc":2.25,"fin":8.5,"fb":"Bài thể hiện trải nghiệm cá nhân rõ ràng và nhất quán, với góc nhìn riêng rõ rệt: sự trân trọng nét vẽ tay truyền thống của Ghibli giữa thời đại điện ảnh lạm dụng kỹ xảo. Phần mô tả sự kết hợp giữa hội họa và âm nhạc qua từng giai đoạn phim rất chi tiết và tinh tế, kiến thức học phần được vận dụng chính xác với các thuật ngữ cụ thể như tranh Emakimono, đàn Koto. Điểm cần cải thiện rõ nhất là phân tích về điện ảnh - vốn là loại hình trung tâm của tác phẩm - còn khá mỏng, thiếu các yếu tố như góc máy, dựng phim, bố cục khung hình, khiến ba loại hình trong bài bị đặt ngang hàng thay vì thấy rõ điện ảnh là khung tổng hợp. Về hình thức, bài cần sửa lại tiêu đề trang bìa (hiện ghi nhầm “Bài thu hoạch giữa kỳ”), rà lại một số lỗi chính tả, và bổ sung danh mục hình ảnh kèm nguồn cho các hình sử dụng."},"245148411":{"name":"Nguyễn Thị Ngọc Trâm","it":[{"c":"TC1","n":"Trải nghiệm cá nhân","s":1,"f":"Có trải nghiệm cá nhân rõ ràng: lý do chọn phim cụ thể, cảnh nhớ nhất (Mộng Hoài dùng ngôn ngữ cơ thể nói chuyện với ba) kèm cảm nhận riêng, và ảnh tự chụp lúc xem tại rạp."},{"c":"TC2","n":"Yếu tố nghệ thuật và dẫn chứng","s":0.75,"f":"Bài nêu nhiều yếu tố nghệ thuật (hình ảnh, âm thanh, âm nhạc, diễn xuất, ánh sáng) với dẫn chứng khá cụ thể: âm nhạc được phân tích sâu (thể loại, ca khúc, vai trò thay lời thoại), diễn xuất có cảnh cụ thể (Mộng Hoài dùng ngôn ngữ cơ thể), và có nhắc kỹ thuật điện ảnh cụ thể (quay one-shot, chống rung Steadicam). Tuy nhiên hình ảnh, màu sắc và ánh sáng vẫn chỉ được nêu tên chung, chưa có dẫn chứng chi tiết bằng cảnh cụ thể."},{"c":"TC3","n":"Giải thích tác động","s":0.75,"f":"Giải thích tác động khá rõ ở cảnh Mộng Hoài dùng ngôn ngữ cơ thể nói chuyện với ba (hành động - cảm nhận - bài học: “giao tiếp không chỉ được tạo nên từ lời nói”), và phần âm nhạc cũng có câu nói về cảm xúc cụ thể. Tuy nhiên các phần khác (Phần 3, tổng kết âm nhạc) chỉ dừng ở nhận xét chung như “mãn nhĩ”, “lắng đọng”, “tạo trải nghiệm cảm xúc cho người xem” mà chưa giải thích cụ thể tác động là gì."},{"c":"TC4","n":"Nhận xét và góc nhìn riêng","s":0.75,"f":"Có một thông điệp/góc nhìn riêng khá rõ ở cảnh Mộng Hoài dùng ngôn ngữ cơ thể nói chuyện với ba (“giao tiếp không chỉ được tạo nên từ lời nói mà còn đến từ ánh mắt, hành động và sự thấu hiểu”), nhưng thông điệp này chỉ xuất hiện ở một cảnh, không được nhắc lại hay phát triển thêm xuyên suốt bài (ví dụ ở phần âm nhạc hoặc phần liên hệ học phần) để trở thành một góc nhìn nhất quán cho cả bài."},{"c":"TC5","n":"Vận dụng kiến thức","s":0.5,"f":"Vận dụng khái niệm ở mức cơ bản"},{"c":"TC6","n":"Sự kết hợp trong tác phẩm","s":0.5,"f":"Chưa thấy rõ sự phối hợp các yếu tố"},{"c":"TC7","n":"Nhận thức đa loại hình","s":0.5,"f":"Có nhắc loại hình khác, chưa sâu"},{"c":"TC8","n":"Cấu trúc và độ dài","s":0.5,"f":"Vượt giới hạn từ"},{"c":"TC9","n":"Hình ảnh và nguồn","s":0.75,"f":"Có ảnh tự chụp (Hình 2) và danh sách nguồn ở cuối bài, nhưng Hình 3 (cảnh trích từ phim) không ghi nguồn và không nói rõ cắt từ phần nào của phim."},{"c":"TC10","n":"Trình bày và định dạng","s":1.0,"f":"Bìa còn sót ký hiệu mẫu “<2026>”, mã lớp ghi sai (GDP1135 thay vì GPD1135), và có lỗi lặp từ “hoài hoài hoài niệm” ở Phần 2, nhưng các lỗi này nhẹ, không ảnh hưởng đáng kể đến trình bày chung."}],"sa":3.25,"sb":1.5,"sc":2.25,"fin":7.0,"fb":"Em có trải nghiệm cá nhân rõ và có ảnh tự chụp, điều này rất tốt. Tuy vậy nhiều nhận định về âm nhạc và kỹ thuật quay còn chung chung, chưa gắn với một cảnh cụ thể nên chưa tạo được dẫn chứng thuyết phục; phần giải thích tác động cũng nên đi sâu hơn. Bài dài khoảng 1260 từ, vượt giới hạn, em cần rút gọn. Bìa ghi sai mã lớp (261.GDP1135 thay vì 261.GPD1135) và còn ký hiệu <2026>."},"245037641":{"name":"Nguyễn Ngọc Yến Nhi","it":[{"c":"TC1","n":"Trải nghiệm cá nhân","s":0.5,"f":"Có nêu một ấn tượng cá nhân ở đầu Phần 2 (“điều gây ấn tượng mạnh mẽ nhất đối với em…”), nhưng các đoạn phía sau mang tính giới thiệu: tác động được nói ở mức văn hóa, di sản, không nói cảm xúc tác động lên chính em; không có cảnh nhớ nhất hay chi tiết lúc xem."},{"c":"TC2","n":"Yếu tố nghệ thuật và dẫn chứng","s":1.0,"f":"Phân tích yếu tố nghệ thuật chi tiết, đa dạng"},{"c":"TC3","n":"Giải thích tác động","s":1,"f":"Nối được yếu tố với hiệu quả (đình cổ + góc quay mượt gợi chiều sâu văn hóa; rap như lời đáp trong lối hát đối giao duyên), nhưng mới nêu hiệu quả chung, chưa giải thích cụ thể yếu tố đó tạo ra cảm xúc hay ấn tượng gì ở một cảnh nhất định."},{"c":"TC4","n":"Nhận xét và góc nhìn riêng","s":1,"f":"Có nhận định riêng rõ ràng: MV là “một thử nghiệm nghệ thuật chín muồi và đầy bản lĩnh”, “chiếc cầu nối tôn vinh di sản dân tộc” đến công chúng trẻ (Phần 2), cùng nhận xét về xu hướng đa loại hình ở Phần 3."},{"c":"TC5","n":"Vận dụng kiến thức","s":1.0,"f":"Vận dụng kiến thức rất tốt"},{"c":"TC6","n":"Sự kết hợp trong tác phẩm","s":1.0,"f":"Phân tích phối hợp âm nhạc, hình, trang phục rất tốt"},{"c":"TC7","n":"Nhận thức đa loại hình","s":0.75,"f":"Liên hệ được nhiều loại hình (âm nhạc, mỹ thuật, điện ảnh, trình diễn) và nêu đúng tính bổ trợ giữa chúng, nhưng các loại hình được đặt ngang hàng, chưa nêu rõ đây là MV âm nhạc nên âm nhạc là loại hình chính, các loại hình còn lại bổ trợ."},{"c":"TC8","n":"Cấu trúc và độ dài","s":0.5,"f":"Thân bài khoảng 1030 từ, vượt giới hạn tối đa 880 từ (mốc 600-800, xê xích 10%); cả ba phần đều dài hơn khoảng đề cho (Phần 1 ~164, Phần 2 ~540, Phần 3 ~324 từ). Đủ 3 phần theo đúng thứ tự."},{"c":"TC9","n":"Hình ảnh và nguồn","s":1,"f":"Có 4 hình có chú thích, danh mục hình ảnh đúng dạng “Hình 1. Tên hình” và danh sách tài liệu tham khảo 5 mục."},{"c":"TC10","n":"Trình bày và định dạng","s":1,"f":"Bìa có đủ thông tin chính, bố cục rõ ràng, có danh mục hình và tài liệu tham khảo ở cuối bài."}],"sa":3.5,"sb":2.75,"sc":2.5,"fin":8.75,"fb":"Phần phân tích yếu tố nghệ thuật của em rất tốt, em có nhận định riêng rõ ràng và nắm vững kiến thức học phần. Em liên hệ được nhiều loại hình (âm nhạc, tạo hình, điện ảnh, trình diễn), nhưng cần làm rõ đây là MV âm nhạc nên loại hình trung tâm là gì và các loại hình còn lại bổ trợ cho nó ra sao. Về trải nghiệm cá nhân, em có nêu điều gây ấn tượng mạnh nhất ở đầu Phần 2, nhưng các đoạn sau đọc như bài giới thiệu, chưa kể một khoảnh khắc cụ thể mình xem và cảm xúc của riêng em. Khi giải thích tác động, em nên chỉ rõ một yếu tố cụ thể tạo ra cảm xúc gì ở một cảnh nhất định thay vì nêu hiệu quả chung. Cuối cùng, bài dài khoảng 1030 từ, vượt giới hạn tối đa 880 từ; em cần rút gọn, nhất là Phần 1 và Phần 3."},"245164703":{"name":"Lăng Tiến Đạt","it":[{"c":"TC1","n":"Trải nghiệm cá nhân","s":1,"f":"Trải nghiệm cá nhân rõ: lần đầu xem tại rạp cùng bạn bè, xem lại nhiều lần, cảnh nhớ nhất (truy lùng chú Sáu) và liên hệ bản thân (“như nhìn thấy chính bản thân mình”)."},{"c":"TC2","n":"Yếu tố nghệ thuật và dẫn chứng","s":0.75,"f":"Có dẫn chứng cụ thể ở nhiều yếu tố (gam màu lạnh/nóng, tiếng bom, tiếng đất rơi, nhịp tim, góc quay cận, ánh sáng lập lòe), nhưng số lượng dẫn chứng theo từng loại hình còn ít: màu sắc mới nêu theo nhóm cảnh chung, chất liệu sân khấu (nữ du kích hát) chỉ có một câu mô tả."},{"c":"TC3","n":"Giải thích tác động","s":1,"f":"Giải thích tác động rõ: cảnh nhớ nhất (nín thở, nén ho → đấu tranh tâm lý nội tâm), âm thanh kích thích giác quan, màu sắc lạnh/nóng gợi căng thẳng và hy vọng."},{"c":"TC4","n":"Nhận xét và góc nhìn riêng","s":1.0,"f":"Góc nhìn riêng nổi bật, có lập luận"},{"c":"TC5","n":"Vận dụng kiến thức","s":1.0,"f":"Vận dụng kiến thức tốt"},{"c":"TC6","n":"Sự kết hợp trong tác phẩm","s":1.0,"f":"Phối hợp các yếu tố được phân tích rất tốt"},{"c":"TC7","n":"Nhận thức đa loại hình","s":1,"f":"Nêu rõ điện ảnh là loại hình kết nối hội họa, sân khấu, âm thanh, văn học, kiến trúc và giải thích các yếu tố hỗ trợ lẫn nhau."},{"c":"TC8","n":"Cấu trúc và độ dài","s":0.5,"f":"Thân bài khoảng 1046 từ, vượt giới hạn tối đa 880 từ (mốc 600-800, xê xích 10%); cả ba phần đều dài hơn khoảng đề cho (Phần 1 ~183, Phần 2 ~533, Phần 3 ~330 từ). Đủ 3 phần theo đúng thứ tự."},{"c":"TC9","n":"Hình ảnh và nguồn","s":1,"f":"Có 4 hình minh họa kèm chú thích, danh mục hình ảnh và mục tài liệu tham khảo, có ảnh tự chụp."},{"c":"TC10","n":"Trình bày và định dạng","s":0.75,"f":"Bìa còn ký hiệu mẫu “<2026>” ở dòng cuối; bố cục các phần rõ ràng."}],"sa":3.75,"sb":3.0,"sc":2.25,"fin":9.0,"fb":"Bài của em có trải nghiệm cá nhân rõ ràng, góc nhìn riêng, giải thích tác động rất tốt và phân tích sự phối hợp giữa các yếu tố nghệ thuật; em còn nêu được điện ảnh là loại hình kết nối các loại hình khác. Để phần dẫn chứng chắc hơn, em nên bổ sung thêm dẫn chứng cụ thể cho từng loại hình, ví dụ gắn màu sắc với một cảnh cụ thể và mở rộng phần chất liệu sân khấu (cảnh nữ du kích hát). Về hình thức, bài dài khoảng 1046 từ, vượt giới hạn tối đa 880 từ; em cần rút gọn, nhất là Phần 1 và Phần 3. Trang bìa em nhớ bỏ ký hiệu mẫu <2026> ở dòng cuối."},"235321544":{"name":"Lê Trịnh Khánh Hòa","it":[{"c":"TC1","n":"Trải nghiệm cá nhân","s":0.5,"f":"Cảm nhận cá nhân còn chung chung"},{"c":"TC2","n":"Yếu tố nghệ thuật và dẫn chứng","s":1,"f":"Phân tích yếu tố nghệ thuật cụ thể và có dẫn chứng: tương phản gam tối của yêu quái và gam sáng của nhóm ở cảnh cuối, hình khối, đường nét, tỉ lệ từng nhân vật (Rumi, Mira, Zoey, Saja Boys), âm nhạc và chuyển động."},{"c":"TC3","n":"Giải thích tác động","s":0.75,"f":"Giải thích tác động khá rõ"},{"c":"TC4","n":"Nhận xét và góc nhìn riêng","s":0.75,"f":"Có thông điệp/nhận định riêng rõ ở cảnh cuối (sức mạnh tình bạn, sự đồng lòng, niềm tin vào nhau), nhưng chỉ nằm ở một cảnh, chưa được nhắc lại xuyên suốt bài."},{"c":"TC5","n":"Vận dụng kiến thức","s":0.75,"f":"Vận dụng được một số khái niệm"},{"c":"TC6","n":"Sự kết hợp trong tác phẩm","s":1,"f":"Nêu được cách các yếu tố cùng tạo cao trào ở cảnh cuối (âm nhạc, chuyển động, màu sắc, hiệu ứng) và ở Phần 3 chỉ ra âm nhạc kết hợp hình ảnh, vũ đạo làm màn trình diễn nổi bật."},{"c":"TC7","n":"Nhận thức đa loại hình","s":0.75,"f":"Liên hệ loại hình khá tốt"},{"c":"TC8","n":"Cấu trúc và độ dài","s":0.5,"f":"Thân bài khoảng 1256 từ, vượt giới hạn tối đa 880 từ (mốc 600-800, xê xích 10%); cả ba phần đều dài hơn khoảng đề cho (Phần 1 ~230, Phần 2 ~693, Phần 3 ~333 từ). Đủ 3 phần theo đúng thứ tự."},{"c":"TC9","n":"Hình ảnh và nguồn","s":0.25,"f":"Chỉ có 1 hình minh họa (poster), không có số, chú thích hay nguồn; đề yêu cầu tối thiểu 3 hình. Chưa có danh mục hình ảnh và tài liệu tham khảo."},{"c":"TC10","n":"Trình bày và định dạng","s":0.75,"f":"Dòng cuối bìa còn ngoặc nhọn của bìa mẫu “< năm 2026>”; có một số lỗi chính tả/gõ sai trong bài (“THÀNH PHỒ”, “đơn đọc”, “Nhân vâth”, “thành viện”, “giúo”, “cảm xúc xúc”)."}],"sa":3.0,"sb":2.5,"sc":1.5,"fin":7.0,"fb":"Phần phân tích yếu tố nghệ thuật của em rất cụ thể, nhất là tạo hình nhân vật (Rumi, Mira, Zoey, Saja Boys) và cảnh cuối; em cũng mô tả tốt cách âm nhạc, chuyển động, màu sắc cùng tạo cao trào, giải thích tác động và liên hệ các loại hình khá tốt, và có thông điệp riêng về tình bạn, sự đồng lòng. Điểm cần cải thiện đầu tiên là trải nghiệm cá nhân: em nên kể rõ hoàn cảnh xem và cảm xúc cụ thể của mình ở một cảnh, thay vì chỉ nói chung là cuốn hút, giải trí, và nên nhắc lại thông điệp riêng xuyên suốt bài. Bài chỉ có một hình (poster) không có số, chú thích, nguồn; em cần có ít nhất 3 hình có chú thích, danh mục hình ảnh và nguồn. Bài dài khoảng 1256 từ, vượt giới hạn tối đa 880 từ; em cần rút gọn. Cuối cùng, em nên rà soát lại chính tả (ví dụ “THÀNH PHỒ”, “đơn đọc”, “Nhân vâth”, “giúo”) và bỏ ký hiệu < > ở bìa."},"255093701":{"name":"Ngô Lê Thảo Anh","it":[{"c":"TC1","n":"Trải nghiệm cá nhân","s":1,"f":"Trải nghiệm cá nhân rõ và sinh động: xem phim 4 lần, nêu lý do chọn phim, ba cảnh tâm đắc kèm cảm xúc cụ thể (“im lặng vì quá cảm xúc nghẹn ngào”) và có ảnh tự chụp."},{"c":"TC2","n":"Yếu tố nghệ thuật và dẫn chứng","s":0.75,"f":"Có nhắc các loại hình (điện ảnh, diễn xuất, âm nhạc) và dẫn chứng lời thoại của Ông Nội, bài hát OST “Rực Rỡ”, nhưng nhiều đoạn kể lại diễn biến phim; hình ảnh, màu sắc, ánh sáng, góc máy chưa được phân tích cụ thể (ví dụ cảnh ở Hình 2.2)."},{"c":"TC3","n":"Giải thích tác động","s":0.75,"f":"Giải thích tác động khá rõ ở câu thoại của Ông Nội (khiến em suy nghĩ về việc người trẻ hiểu công lao người lính), nhưng tác động của âm nhạc, hình ảnh còn chung chung, và cảm xúc ở các cảnh chủ yếu đến từ diễn biến cốt truyện chứ chưa chỉ ra yếu tố nghệ thuật nào gây ra."},{"c":"TC4","n":"Nhận xét và góc nhìn riêng","s":0.75,"f":"Có quan điểm riêng (người trẻ chỉ nhớ công lao người lính vào “mùa” kỉ niệm; phim có motip mới về gia đình và chiến tranh), nhưng chưa được phát triển xuyên suốt bài và một số câu ở mục 2.4 còn khó hiểu."},{"c":"TC5","n":"Vận dụng kiến thức","s":0.75,"f":"Dùng đúng tên các loại hình (điện ảnh, âm nhạc, nghệ thuật biểu diễn) và nhắc đa loại hình, đa giác quan; chưa dùng khái niệm nào để phân tích sâu (màu sắc, ánh sáng, nhịp điệu…) và có vài chỗ dùng thuật ngữ chưa chính xác (“đặc điểm điện ảnh là hình ảnh và lời nói của Ông Nội”)."},{"c":"TC6","n":"Sự kết hợp trong tác phẩm","s":0.5,"f":"Nêu chung rằng hình ảnh, diễn xuất, lời nói kết hợp với âm nhạc làm phim hoàn thiện và cảm xúc hơn, nhưng chưa mô tả cụ thể một cảnh nơi các yếu tố cùng tạo hiệu ứng."},{"c":"TC7","n":"Nhận thức đa loại hình","s":0.75,"f":"Nêu được các loại hình (điện ảnh, biểu diễn, âm thanh, thị giác), nhấn mạnh điện ảnh là chính (mục 2.4) và giải thích xu hướng đa loại hình; liên hệ chưa mở rộng sang loại hình khác và nhận xét về loại hình nổi bật chưa nhất quán (điện ảnh ở mục 2.4, diễn xuất và âm nhạc ở Phần 3)."},{"c":"TC8","n":"Cấu trúc và độ dài","s":0.25,"f":"Thân bài khoảng 1388 từ, vượt giới hạn tối đa 880 từ (mốc 600-800, xê xích 10%); cả ba phần lệch khoảng đề cho (Phần 1 ~309, Phần 2 ~886, Phần 3 ~193 từ). Đủ 3 phần theo đúng thứ tự."},{"c":"TC9","n":"Hình ảnh và nguồn","s":1,"f":"Có 4 hình minh họa có số và chú thích (có ảnh tự chụp), và có mục nguồn cho hình lấy từ bên ngoài (poster, ảnh OST)."},{"c":"TC10","n":"Trình bày và định dạng","s":0.75,"f":"Bìa ghi tiêu đề “BÀI THU HOẠCH” (đề yêu cầu “Bài thu hoạch cá nhân”) và học phần “NGHỆ THUẬT HỌC” (đúng là “Nghệ thuật học cơ bản”); chưa có danh mục hình ảnh riêng."}],"sa":3.25,"sb":2.0,"sc":2.0,"fin":7.25,"fb":"Trải nghiệm cá nhân của em rất sinh động và có ảnh tự chụp, em giải thích được tác động của câu thoại Ông Nội lên suy nghĩ của mình. Để bài chắc hơn, em nên phân tích cụ thể các yếu tố nghệ thuật như hình ảnh, màu sắc, ánh sáng, góc máy thay vì kể lại diễn biến phim, và chỉ rõ yếu tố nào tạo ra cảm xúc ở từng cảnh (âm nhạc, hình ảnh…). Quan điểm riêng của em nên được phát triển xuyên suốt bài, một số câu ở mục 2.4 cần viết rõ ý hơn. Về hình thức, bài dài khoảng 1388 từ, vượt giới hạn tối đa 880 từ; em cần rút gọn, nhất là Phần 2 (khoảng 886 từ). Bìa cần ghi đúng tiêu đề “Bài thu hoạch cá nhân” và tên học phần “Nghệ thuật học cơ bản”, đồng thời nên bổ sung danh mục hình ảnh riêng."},"245190295":{"name":"Vương Thị Cẩm Vân","it":[{"c":"TC1","n":"Trải nghiệm cá nhân","s":1.0,"f":"Có lý do chọn và trải nghiệm cá nhân (“những trải nghiệm khi theo dõi Incendies đã giúp tôi thấu hiểu sâu sắc hơn…”), cảnh ấn tượng nhất, cảm xúc riêng"},{"c":"TC2","n":"Yếu tố nghệ thuật và dẫn chứng","s":1.0,"f":"Phân tích yếu tố nghệ thuật rất tốt, dẫn chứng cụ thể"},{"c":"TC3","n":"Giải thích tác động","s":1.0,"f":"Giải thích tác động rất tốt"},{"c":"TC4","n":"Nhận xét và góc nhìn riêng","s":0.75,"f":"Có nhận định riêng về cột mốc chuyển biến tâm lý của Nawal; phần còn lại thiên về ca ngợi chung (“kiệt tác”, “xuất sắc”)"},{"c":"TC5","n":"Vận dụng kiến thức","s":1,"f":"Vận dụng đúng và có chủ đích nhiều khái niệm đã học (bố cục không gian, màu sắc tương phản, ánh sáng, âm thanh, khoảng lặng, nhịp điệu, diễn xuất), gắn với chi tiết cụ thể"},{"c":"TC6","n":"Sự kết hợp trong tác phẩm","s":0.5,"f":"Phân tích từng yếu tố riêng (bố cục và màu sắc, âm thanh, diễn xuất), chưa chỉ rõ các yếu tố hỗ trợ nhau thế nào trong cùng một khoảnh khắc"},{"c":"TC7","n":"Nhận thức đa loại hình","s":0.5,"f":"Có nhận ra các loại hình đan xen, bổ trợ nhau; nhưng chưa nêu loại hình nào là chính, loại hình nào bổ trợ, và chưa giải thích vì sao tác phẩm ngày nay đa loại hình"},{"c":"TC8","n":"Cấu trúc và độ dài","s":0.75,"f":"Phần thân khoảng 868 từ, đạt độ dài; nhưng không chia đề mục Phần 1/2/3 và tỉ lệ các phần lệch (mở bài ~143 từ, phần trải nghiệm ~555 từ, phần liên hệ ~100–170 từ)"},{"c":"TC9","n":"Hình ảnh và nguồn","s":0.5,"f":"Có 3 hình kèm chú thích và danh mục hình, nhưng hình lấy từ phim không ghi nguồn và bài không có tài liệu tham khảo"},{"c":"TC10","n":"Trình bày và định dạng","s":0.75,"f":"Bìa ghi “BÀI THU HOẠCH GIỮA KỲ” (đề yêu cầu “Bài thu hoạch cá nhân”); có vài lỗi chính tả (“mạnh mẹ”, “bổ trở”, “kịch tích”)"}],"sa":3.75,"sb":2.0,"sc":2.0,"fin":7.75,"fb":"Phần phân tích yếu tố nghệ thuật và giải thích tác động của Incendies rất tốt, dẫn chứng cụ thể và có chiều sâu; em nêu được trải nghiệm cá nhân và cảm xúc riêng ở cảnh chiếc xe bus, bài có độ dài phù hợp và có danh mục hình. Bài cần chia rõ Phần 1, 2, 3 theo đề và cân đối dung lượng: mở bài và phần trải nghiệm đang dài hơn yêu cầu, phần liên hệ còn ngắn. Ở phần liên hệ, em đã nhận ra các loại hình đan xen và bổ trợ nhau, nhưng cần chỉ rõ loại hình nào là chính, loại hình nào bổ trợ và vì sao sản phẩm nghệ thuật ngày nay ngày càng đa loại hình. Hình cần có nguồn và bài cần có tài liệu tham khảo. Bìa nên ghi đúng tiêu đề “Bài thu hoạch cá nhân” và em soát lại lỗi chính tả."},"255154739":{"name":"Phùng Thị Thúy Mây","it":[{"c":"TC1","n":"Trải nghiệm cá nhân","s":1.0,"f":"Trải nghiệm rất sống động, nhiều chi tiết thật"},{"c":"TC2","n":"Yếu tố nghệ thuật và dẫn chứng","s":1,"f":"Nêu nhiều yếu tố với dẫn chứng cụ thể từ buổi concert (màn LED, góc quay toàn cảnh và cận mặt, đèn laser và lightstick, nhảy hip-hop, tên bài hát)"},{"c":"TC3","n":"Giải thích tác động","s":1.0,"f":"Giải thích tác động rất tốt"},{"c":"TC4","n":"Nhận xét và góc nhìn riêng","s":1,"f":"Có góc nhìn riêng rõ: nhan đề “PUT YOUR PHONE DOWN” là thông điệp phản ánh xã hội chìm trong điện thoại, gắn với trải nghiệm của em"},{"c":"TC5","n":"Vận dụng kiến thức","s":1.0,"f":"Vận dụng kiến thức rất tốt"},{"c":"TC6","n":"Sự kết hợp trong tác phẩm","s":0.75,"f":"Có chỉ ra các cặp hỗ trợ nhau, nhưng phần giữa chủ yếu liệt kê từng loại hình và từng bài hát; chỉ ở nhóm bài trầm (ánh sáng hắt hiu, cận mặt, giọng nghẹn) mới gắn được các yếu tố vào cùng một khoảnh khắc, chưa đủ"},{"c":"TC7","n":"Nhận thức đa loại hình","s":0.75,"f":"Giải thích được vì sao sản phẩm ngày nay đa loại hình và vai trò của công nghệ số; chưa nêu loại hình nào là chính, loại hình nào bổ trợ"},{"c":"TC8","n":"Cấu trúc và độ dài","s":0.5,"f":"Phần thân khoảng 1485 từ, vượt xa mức tối đa 880; cả ba phần đều dài hơn yêu cầu (Phần 2 ~899 từ, Phần 3 ~348 từ); chia đủ ba phần"},{"c":"TC9","n":"Hình ảnh và nguồn","s":1,"f":"Có 5 hình có chú thích, có ảnh tự chụp/minh chứng tham gia trực tiếp"},{"c":"TC10","n":"Trình bày và định dạng","s":0.5,"f":"Nộp .docx thay vì PDF; cỡ chữ 13 thay vì 12; có lỗi chính tả (“trai nghiệm”, “quá khữ”, “qualawng”, “cà chính em”)"}],"sa":4.0,"sb":2.5,"sc":2.0,"fin":8.5,"fb":"Trải nghiệm xem concert tại rạp của em rất sống động, dẫn chứng cụ thể, giải thích tác động rõ, có góc nhìn riêng về thông điệp “PUT YOUR PHONE DOWN” và vận dụng kiến thức học tốt; đây là điểm mạnh nhất của bài. Ở phần các bài hát, em nên phân tích cụ thể hơn (tiết tấu nhanh hay chậm, giai điệu, lời nhạc) thay vì chủ yếu liệt kê tên bài, và chỉ rõ các yếu tố hỗ trợ nhau trong cùng một khoảnh khắc như em đã làm ở nhóm bài trầm; ở phần liên hệ, em cũng nên nêu loại hình nào là chính và loại hình nào bổ trợ. Bài dài khoảng 1485 từ, gần gấp đôi giới hạn, em cần chọn lọc ý để mỗi phần đúng dung lượng. Em nên nộp file PDF, dùng chữ cỡ 12, soát lại lỗi chính tả, ghi nguồn cho Hình 1 và thêm danh mục hình."},"255121983":{"name":"Nguyễn Thanh Vy","it":[{"c":"TC1","n":"Trải nghiệm cá nhân","s":0.5,"f":"Lý do chọn tác phẩm còn khá chung, em nên thêm điều riêng khiến em chọn đúng tác phẩm này; cảm xúc bản thân ở Phần 2 không nêu rõ là cảm xúc gì, chỉ mô tả hiệu ứng thị giác"},{"c":"TC2","n":"Yếu tố nghệ thuật và dẫn chứng","s":1,"f":"Nêu dẫn chứng cụ thể từ cả 4 hình: màu sắc, tương phản, ánh sáng"},{"c":"TC3","n":"Giải thích tác động","s":0.5,"f":"Có giải thích tác động nhưng còn hời hợt: dừng ở “tạo cảm xúc”, không nói rõ cảm xúc gì và vì sao yếu tố đó tạo ra cảm xúc ấy"},{"c":"TC4","n":"Nhận xét và góc nhìn riêng","s":0.5,"f":"Chưa có nhận định, đánh giá hay so sánh với tác phẩm khác, chưa có lập trường riêng (“theo em…”); mới dừng ở mô tả"},{"c":"TC5","n":"Vận dụng kiến thức","s":0.75,"f":"Vận dụng tốt khái niệm cơ bản (màu sắc, ánh sáng, chuyển động, âm nhạc) nhưng chưa nhắc góc máy, cách dựng (montage), nhịp điệu cảnh"},{"c":"TC6","n":"Sự kết hợp trong tác phẩm","s":0.5,"f":"Có liệt kê các yếu tố và câu khái quát “không hoạt động riêng lẻ” nhưng không chỉ rõ yếu tố nào bổ sung cho yếu tố nào, không liên hệ lại hình cụ thể: vẫn dừng ở liệt kê"},{"c":"TC7","n":"Nhận thức đa loại hình","s":0.5,"f":"Có nhắc loại hình khác nhưng sơ lược"},{"c":"TC8","n":"Cấu trúc và độ dài","s":1.0,"f":"Đủ 3 phần; thể loại đã nêu (hoạt hình) trong lý do chọn"},{"c":"TC9","n":"Hình ảnh và nguồn","s":1,"f":"Đủ số, chú thích, nguồn, danh mục hình"},{"c":"TC10","n":"Trình bày và định dạng","s":1,"f":"Bìa, mục lục, danh mục hình đủ và đúng; bố cục rõ ràng, ổn. Chú thích Hình 1, 2 còn vụng nhưng ít ảnh hưởng hình thức tổng thể"}],"sa":2.5,"sb":1.75,"sc":3.0,"fin":7.25,"fb":"Em trình bày bài rất chỉn chu: bìa, mục lục và danh mục hình đầy đủ, bố cục rõ ràng, chỉ có chú thích Hình 1 và Hình 2 em nên viết lại cho gọn và rõ nghĩa hơn. Phần quan sát màu sắc, tương phản và ánh sáng qua cả bốn hình là điểm mạnh của bài, có dẫn chứng cụ thể. Điều em cần cải thiện trước hết là tiếng nói cá nhân: lý do chọn tác phẩm còn khá chung, em hãy thêm một điều riêng khiến em chọn đúng tác phẩm này, và ở Phần 2 em mới mô tả hiệu ứng thị giác chứ chưa nói rõ mình đã cảm thấy gì (căng thẳng, bất an, phấn khích…) và vì sao yếu tố đó khiến em có cảm xúc ấy. Em cũng nên mạnh dạn đưa ra nhận định riêng, chẳng hạn so sánh với một tác phẩm khác em từng xem hoặc nêu điều em thấy hiệu quả và chưa hiệu quả. Ở Phần 3, em liệt kê được nhiều yếu tố (bố cục, ánh sáng, màu sắc, âm nhạc, chuyển động, tạo hình nhân vật) và nhận ra chúng không hoạt động riêng lẻ, nhưng chưa chỉ ra yếu tố nào bổ sung cho yếu tố nào; em thử quay lại một hình cụ thể để phân tích sự phối hợp đó, và bổ sung các khái niệm điện ảnh như góc máy, cách dựng, nhịp điệu cảnh. Cố gắng thêm một chút nữa là bài của em sẽ rất tốt."}};
var CD=["SV kể trải nghiệm thật của mình với tác phẩm: vì sao chọn, xem trong hoàn cảnh nào, khoảnh khắc nhớ nhất và cảm xúc riêng. Ảnh tự chụp khi trải nghiệm là điểm cộng.", "SV nhận ra các yếu tố nghệ thuật tạo nên ấn tượng (màu sắc, ánh sáng, âm thanh, diễn xuất, góc quay…) và dùng chi tiết cụ thể trong tác phẩm làm dẫn chứng.", "SV giải thích yếu tố đó tạo ra cảm xúc hay ấn tượng gì cho SV và vì sao, theo trình tự quan sát, dẫn chứng, giải thích.", "SV có nhận định, đánh giá hoặc thông điệp riêng về tác phẩm và giữ được xuyên suốt bài, không chỉ khen chung hay tóm tắt nội dung.", "SV dùng đúng các khái niệm đã học (màu sắc, ánh sáng, nhịp điệu, không gian, âm thanh…) để phân tích, không chỉ gọi tên.", "SV chỉ ra các yếu tố hoặc loại hình hỗ trợ, bổ sung nhau trong cùng một cảnh hoặc khoảnh khắc, không chỉ liệt kê từng yếu tố.", "SV nhận ra tác phẩm kết hợp những loại hình nào, loại hình nào là chính và loại hình nào bổ trợ, và vì sao sản phẩm nghệ thuật ngày nay ngày càng đa loại hình.", "Bài có đủ ba phần theo đúng thứ tự và đúng dung lượng: 600–800 từ (xê xích 10%), Phần 1 khoảng 80–100 từ, Phần 2 khoảng 320–420 từ, Phần 3 khoảng 200–280 từ.", "Có ít nhất 3 hình minh họa kèm số và chú thích, ghi nguồn cho hình lấy từ bên ngoài, có danh mục hình (từ 3 hình trở lên) và tài liệu tham khảo nếu có trích nguồn.", "Bài trình bày đúng đề: nộp file PDF, Times New Roman cỡ 12, giãn dòng 1,5, bìa ghi đúng tiêu đề “Bài thu hoạch cá nhân”, bố cục sạch, ít lỗi chính tả."];
var PRES={"g3": {"nh": 3, "sh": "Đạt & Triệu", "th": "Sự đối lập", "w": ["Hội họa: The Kiss of Judas (Giotto)", "Văn học: A Tale of Two Cities (Dickens)", "Điện ảnh: Black Swan (Aronofsky)"], "m": ["Lăng Tiến Đạt", "Mạnh Dương Triệu"], "min": "khoảng 18 phút", "it": [{"c": "1.1", "n": "Chọn tác phẩm", "q": "Ba tác phẩm có phù hợp chủ đề không, có đủ chất liệu để phân tích không, cách chọn có mới/khó (loại hình như kiến trúc, điêu khắc, sân khấu) hay không.", "s": 1, "m": 1.25, "g": 0, "lv": 1, "f": "Ba tác phẩm đều có yếu tố đối lập rõ và hợp chủ đề. Tuy nhiên cả ba là tác phẩm kinh điển, loại hình quen thuộc nên chưa mới và chưa khó bằng những nhóm chọn loại hình khó hoặc cách chọn mới.", "cap": ""}, {"c": "1.2", "n": "Nhận diện yếu tố/ngôn ngữ nghệ thuật", "q": "Gọi đúng và cụ thể các yếu tố/ngôn ngữ nghệ thuật đặc trưng của từng loại hình (không chỉ liệt kê chung chung).", "s": 1, "m": 1, "g": 0, "lv": 0, "f": "Hai em nhận diện đủ yếu tố ở cả ba loại hình: màu áo vàng, khoảng tĩnh, biểu cảm (hội họa); bối cảnh song song, nhân vật phản chiếu (văn học); bỏ nhạc nền, cận cảnh, góc nghiêng, dựng dồn nhịp (điện ảnh). Đây là mức cao nhất trong lớp ở tiêu chí này.", "cap": ""}, {"c": "1.3", "n": "Dẫn chứng, ghi nguồn, tài liệu tham khảo, chính tả", "q": "Dẫn chứng cụ thể từ tác phẩm (chi tiết, trích đoạn, cảnh), ghi nguồn hình/media, có tài liệu tham khảo, ít lỗi chính tả.", "s": 0.75, "m": 1, "g": 0, "lv": 1, "f": "Có chi tiết trên tranh, phân cảnh Nina đâm Lily và lời thoại \"I felt it. I was perfect\". Phần văn học chưa trích câu chữ trong ngoặc kép, có khoảng 5 lỗi chính tả (sai xót, gianxảo, khoảng khắc, dụng phim, Diễn ảnh) và lúc thuyết trình chưa có tài liệu tham khảo. Điểm thấp hơn một số nhóm khác ở tiêu chí này.", "cap": ""}, {"c": "1.4", "n": "Giải thích chi tiết → yếu tố → tác dụng → chủ đề", "q": "Giải thích được chuỗi: chi tiết → yếu tố nghệ thuật → tác dụng → cách thể hiện chủ đề (không chỉ kể lại hay mô tả).", "s": 0.75, "m": 1, "g": 0, "lv": 1, "f": "Cả ba tác phẩm đều có chuỗi chi tiết, yếu tố, tác dụng (phần văn học ghi rõ ba bước), nhưng phần tác dụng lặp lại gần giống nhau giữa các tác phẩm. Hai em chưa làm tốt bằng các nhóm còn lại ở tiêu chí này.", "cap": ""}, {"c": "2.1", "n": "So sánh giống/khác và lý giải theo đặc trưng loại hình", "q": "So sánh điểm giống và khác giữa ba tác phẩm, và lý giải sự khác biệt bằng đặc trưng của từng loại hình.", "s": 1.5, "m": 1.75, "g": 1, "lv": 1, "f": "Bảng so sánh chất liệu, không gian-thời gian, cơ chế tạo đối lập và trải nghiệm người xem rất rõ. Phần lý giải nguyên nhân của khác biệt chưa sâu bằng nhóm tốt nhất lớp.", "cap": ""}, {"c": "2.2", "n": "Quan điểm nhóm", "q": "Quan điểm riêng của nhóm (ví dụ loại hình/tác phẩm thể hiện chủ đề thuyết phục nhất), có lập luận và dựa vào phần phân tích.", "s": 0.75, "m": 1.25, "g": 1, "lv": 2, "f": "Hai em chọn Black Swan và nêu quan điểm rõ, nhưng lý do còn chung chung (câu \"không loại hình nào thay thế được\" chưa được giải thích) và chưa dẫn một cảnh cụ thể. Ở tiêu chí này hai em chưa tốt so với các nhóm còn lại.", "cap": ""}, {"c": "3.1", "n": "Slide", "q": "Slide rõ ràng, trực quan, thẩm mỹ; hình/video/âm thanh minh họa đúng chỗ; không quá nhiều chữ; ghi nguồn hình.", "s": 1, "m": 1.5, "g": 2, "lv": 2, "f": "Slide dễ theo dõi, mỗi slide có tên chủ đề, hình phù hợp, bố cục thống nhất. Một số đoạn chữ còn khá nhiều nên điểm thấp hơn các nhóm có slide gọn và trực quan nhất.", "cap": ""}, {"c": "3.2", "n": "Thuyết trình, phối hợp, thời lượng", "q": "Thuyết trình tự tin, mạch lạc, không đọc nguyên văn slide; hai bạn cùng trình bày, phối hợp tốt; đúng thời lượng 12-15 phút.", "s": 1, "m": 1.25, "g": 2, "lv": 1, "f": "Hai em nói tự nhiên, ít nhìn slide, có giao tiếp ánh mắt và thể hiện cảm xúc thật với tác phẩm. Đây là mức cao nhất lớp ở tiêu chí này. Thời lượng khoảng 18 phút, vượt nhẹ so với quy định 12-15 phút nên trừ 0,25 điểm.", "cap": ""}], "sec": [3.5, 2.25, 2], "raw": 7.75, "tot": 7.75, "totS": "7,8", "fin": "Hai em thuyết trình tốt nhất lớp (cùng một nhóm khác): nói tự nhiên, ít nhìn slide, giao tiếp ánh mắt và cho thấy cảm xúc thật với tác phẩm, dù thời lượng khoảng 18 phút hơi vượt mức cho phép. Phần khái niệm sự đối lập rõ ràng, hội họa và điện ảnh được phân tích chi tiết, và ở phần nhận diện yếu tố nghệ thuật hai em đạt điểm cao nhất lớp. Hai em chưa làm tốt bằng các nhóm khác ở ba phần: giải thích chi tiết, yếu tố, tác dụng (phần tác dụng lặp lại), quan điểm nhóm (lý do chọn Black Swan còn chung chung) và slide (một số đoạn chữ nhiều). Để bài tốt hơn, phần văn học nên trích câu văn cụ thể trong ngoặc kép; phần Black Swan nên phân tích thêm màu sắc qua trang phục (ví dụ chi tiết áo bó thể hiện sự đè nén) và dẫn một cảnh cụ thể để giải thích vì sao điện ảnh thuyết phục nhất; hai em cũng cần kiểm tra lại chính tả, rút gọn các đoạn chữ dài và hoàn thiện mục tài liệu tham khảo."}, "g5": {"nh": 5, "sh": "Hòa & Vân", "th": "Thân phận người phụ nữ", "w": ["Văn học: Truyện Kiều (Nguyễn Du)", "Sân khấu: Chuyện người con gái Nam Xương", "Điện ảnh: Cánh đồng bất tận"], "m": ["Lê Trịnh Khánh Hòa", "Vương Thị Cẩm Vân"], "min": "15 phút", "it": [{"c": "1.1", "n": "Chọn tác phẩm", "q": "Ba tác phẩm có phù hợp chủ đề không, có đủ chất liệu để phân tích không, cách chọn có mới/khó (loại hình như kiến trúc, điêu khắc, sân khấu) hay không.", "s": 1.25, "m": 1.25, "g": 0, "lv": 0, "f": "Truyện Kiều, Chuyện người con gái Nam Xương (sân khấu) và Cánh đồng bất tận khớp chủ đề. Việc chọn sân khấu là loại hình khó nên hai em đạt mức cao nhất lớp ở tiêu chí này.", "cap": ""}, {"c": "1.2", "n": "Nhận diện yếu tố/ngôn ngữ nghệ thuật", "q": "Gọi đúng và cụ thể các yếu tố/ngôn ngữ nghệ thuật đặc trưng của từng loại hình (không chỉ liệt kê chung chung).", "s": 0.5, "m": 1, "g": 0, "lv": 2, "f": "Hai em nêu đúng yếu tố (lục bát, từ Hán-Việt; lời thoại, diễn xuất, ánh sáng; góc quay rộng, cận cảnh, màu trầm) nhưng còn chung chung, chưa chỉ ra góc máy hay chi tiết diễn xuất cụ thể. Ở tiêu chí này hai em chưa tốt so với các nhóm còn lại.", "cap": ""}, {"c": "1.3", "n": "Dẫn chứng, ghi nguồn, tài liệu tham khảo, chính tả", "q": "Dẫn chứng cụ thể từ tác phẩm (chi tiết, trích đoạn, cảnh), ghi nguồn hình/media, có tài liệu tham khảo, ít lỗi chính tả.", "s": 1, "m": 1, "g": 0, "lv": 0, "f": "Có trích đoạn thơ Kiều, clip sân khấu, ảnh phim, có slide tài liệu tham khảo và ít lỗi chính tả. Hai em là nhóm làm tốt nhất lớp ở tiêu chí này (điểm tối đa). Cần chỉ rõ hơn câu chữ nói về thân phận và góc máy cụ thể ở phần điện ảnh.", "cap": ""}, {"c": "1.4", "n": "Giải thích chi tiết → yếu tố → tác dụng → chủ đề", "q": "Giải thích được chuỗi: chi tiết → yếu tố nghệ thuật → tác dụng → cách thể hiện chủ đề (không chỉ kể lại hay mô tả).", "s": 1, "m": 1, "g": 0, "lv": 0, "f": "Cả ba tác phẩm đều có ngôn ngữ nghệ thuật, tác dụng và cách thể hiện chủ đề, kèm so sánh khác biệt thân phận (Kiều chủ động, Vũ Nương bế tắc, nhân vật Nương nhẫn nại). Hai em đạt mức cao nhất lớp. Phần yếu tố của sân khấu và điện ảnh còn chung chung.", "cap": ""}, {"c": "2.1", "n": "So sánh giống/khác và lý giải theo đặc trưng loại hình", "q": "So sánh điểm giống và khác giữa ba tác phẩm, và lý giải sự khác biệt bằng đặc trưng của từng loại hình.", "s": 1.25, "m": 1.75, "g": 1, "lv": 2, "f": "Có bảng giống và khác theo ngôn ngữ, hình tượng, cảm xúc, thông điệp, nhưng phần \"khác biệt cốt lõi\" chưa lý giải vì sao và còn nhiều chữ. Hai em chưa làm tốt bằng các nhóm còn lại ở tiêu chí này.", "cap": ""}, {"c": "2.2", "n": "Quan điểm nhóm", "q": "Quan điểm riêng của nhóm (ví dụ loại hình/tác phẩm thể hiện chủ đề thuyết phục nhất), có lập luận và dựa vào phần phân tích.", "s": 0.75, "m": 1.25, "g": 1, "lv": 2, "f": "Quan điểm của hai em mới dừng ở việc tổng kết giá trị nhân đạo, chưa chọn loại hình hay tác phẩm thể hiện tốt nhất và chưa dựa chặt vào phần phân tích. Ở tiêu chí này hai em chưa tốt so với các nhóm còn lại.", "cap": ""}, {"c": "3.1", "n": "Slide", "q": "Slide rõ ràng, trực quan, thẩm mỹ; hình/video/âm thanh min oặc cách chọn mới.", "cap": ""}, {"c": "1.2", "n": "Nhận diện yếu tố/ngôn ngữ nghệ thuật", "q": "Gọi đúng và cụ thể các yếu tố/ngôn ngữ nghệ thuật đặc trưng của từng loại hình (không chỉ liệt kê chung chung).", "s": 0.75, "m": 1, "g": 0, "lv": 1, "f": "Văn học (tiếng chửi, bát cháo hành, biểu tượng), âm nhạc (mô-típ đàn phím, nhịp ổn định, điệp khúc mạnh), hội họa (màu, đường nét, hình khối, bố cục) khá đủ. Còn thiếu: chưa nêu thể loại của Chí Phèo, chưa nói âm sắc giọng hát.", "cap": ""}, {"c": "1.3", "n": "Dẫn chứng, ghi nguồn, tài liệu tham khảo, chính tả", "q": "Dẫn chứng cụ thể từ tác phẩm (chi tiết, trích đoạn, cảnh), ghi nguồn hình/media, có tài liệu tham khảo, ít lỗi chính tả.", "s": 0.75, "m": 1, "g": 0, "lv": 1, "f": "Có chi tiết bát cháo hành, hai bóng đen phía sau The Scream, đoạn MV Numb. Chưa trích câu văn, chưa chỉ ra từ trong ca từ, chưa tìm hiểu bối cảnh sáng tác của Munch, phần nội dung chưa có tài liệu tham khảo và có lỗi chính tả (nổ bật, nguòi, thẩu hiểu, bị kịch). Điểm thấp hơn nhóm làm tốt nhất.", "cap": ""}, {"c": "1.4", "n": "Giải thích chi tiết → yếu tố → tác dụng → chủ đề", "q": "Giải thích được chuỗi: chi tiết → yếu tố nghệ thuật → tác dụng → cách thể hiện chủ đề (không chỉ kể lại hay mô tả).", "s": 1, "m": 1, "g": 0, "lv": 0, "f": "Slide ghi rõ chuỗi chi tiết, nghệ thuật, ý nghĩa (ba cột mốc của Chí Phèo; Numb từ ca từ, nhịp lặp, điệp khúc dẫn đến mệt mỏi rồi phản kháng). Hai em đạt mức cao nhất lớp.", "cap": ""}, {"c": "2.1", "n": "So sánh giống/khác và lý giải theo đặc trưng loại hình", "q": "So sánh điểm giống và khác giữa ba tác phẩm, và lý giải sự khác biệt bằng đặc trưng của từng loại hình.", "s": 1.25, "m": 1.75, "g": 1, "lv": 2, "f": "Có phần tương đồng, đặc trưng từng tác phẩm và vai trò từng loại hình, nhưng còn thiên về nêu từng tác phẩm, ít lý giải. Hai em chưa làm tốt bằng các nhóm còn lại ở tiêu chí này.", "cap": ""}, {"c": "2.2", "n": "Quan điểm nhóm", "q": "Quan điểm riêng của nhóm (ví dụ loại hình/tác phẩm thể hiện chủ đề thuyết phục nhất), có lập luận và dựa vào phần phân tích.", "s": 1, "m": 1.25, "g": 1, "lv": 1, "f": "Hai em chọn Chí Phèo với ba luận điểm cụ thể (tiếng chửi, bát cháo hành, bị từ chối) và có đánh giá; chưa nêu vì sao Chí Phèo hơn hai tác phẩm còn lại.", "cap": ""}, {"c": "3.1", "n": "Slide", "q": "Slide rõ ràng, trực quan, thẩm mỹ; hình/video/âm thanh minh họa đúng chỗ; không quá nhiều chữ; ghi nguồn hình.", "s": 1, "m": 1.5, "g": 2, "lv": 2, "f": "Slide nhiều chữ; chữ nâu nhạt trên nền nâu, cỡ nhỏ nên khó đọc. Điểm thấp hơn các nhóm có slide gọn và trực quan nhất.", "cap": ""}, {"c": "3.2", "n": "Thuyết trình, phối hợp, thời lượng", "q": "Thuyết trình tự tin, mạch lạc, không đọc nguyên văn slide; hai bạn cùng trình bày, phối hợp tốt; đúng thời lượng 12-15 phút.", "s": 0.75, "m": 1.25, "g": 2, "lv": 2, "f": "Giọng rõ, có nhấn nhá nhưng còn phụ thuộc vào slide. Phần trình bày chủ yếu do một bạn đảm nhận, trong khi các nhóm khác đều có hai bạn cùng nói nên phối hợp chưa tốt. Điểm thấp hơn các nhóm nói tự nhiên và chia phần đều.", "cap": ""}], "sec": [3.5, 2.25, 1.75], "raw": 7.5, "tot": 7.5, "totS": "7,5", "fin": "Hai em chọn ba tác phẩm phù hợp chủ đề; phần Chí Phèo với ba cột mốc và quan điểm nhóm có luận điểm rõ ràng, và ở phần giải thích chi tiết, yếu tố, tác dụng hai em đạt mức cao nhất lớp. Giọng thuyết trình rõ, có nhấn nhá. So với các nhóm còn lại, hai em chưa làm tốt ở ba phần: slide (nhiều chữ, màu chữ khó đọc), phần so sánh (còn nêu từng tác phẩm, chưa tốt so với các nhóm còn lại) và thuyết trình (chủ yếu một bạn nói nên phối hợp chưa tốt). Để bài tốt hơn, hai em nên trích câu văn cụ thể (đặt trong ngoặc kép) và chỉ ra từ ngữ trong ca từ Numb thể hiện sự mệt mỏi; cho nghe đúng đoạn cao trào để thấy chất rock và phân tích thêm âm sắc giọng hát; tìm hiểu bối cảnh sáng tác của The Scream để hiểu vì sao khuôn mặt bị biến dạng. Slide nên giảm chữ, chọn font và màu chữ dễ đọc hơn, sửa các lỗi chính tả và bổ sung tài liệu tham khảo cho phần nội dung. Cả hai bạn cùng thuyết trình và nói tự nhiên hơn thay vì phụ thuộc vào slide sẽ giúp phối hợp tốt hơn."}};
var SC=[["1.1", "Chọn tác phẩm", 1.25, ["Ba tác phẩm phù hợp chủ đề, đủ chất liệu phân tích; có loại hình khó (kiến trúc, điêu khắc, sân khấu) hoặc cách chọn mới.", "Phù hợp chủ đề, đủ chất liệu; chủ yếu loại hình quen thuộc (hội họa, văn học, âm nhạc, điện ảnh).", "Phù hợp nhưng cách chọn và khai thác đơn giản, ít chiều sâu.", "Có tác phẩm chưa sát chủ đề hoặc khó phân tích.", "Thiếu tác phẩm hoặc không liên quan chủ đề."]], ["1.2", "Nhận diện yếu tố/ngôn ngữ nghệ thuật", 1, ["Nhận diện chính xác và đa dạng các yếu tố đặc trưng của cả ba loại hình.", "Nhận diện chính xác các yếu tố chính của cả ba tác phẩm.", "Có nêu yếu tố nghệ thuật nhưng sơ lược, thiên về liệt kê.", "Yếu tố nêu chung chung, có nhầm lẫn hoặc thiếu ở một tác phẩm.", "Không nhận diện được yếu tố nghệ thuật."]], ["1.3", "Dẫn chứng, ghi nguồn, tài liệu tham khảo, chính tả", 1, ["Nhiều chi tiết cụ thể cho thấy nhóm thật sự quan sát/trải nghiệm tác phẩm; ghi nguồn hình/media, có tài liệu tham khảo; hầu như không lỗi chính tả.", "Có dẫn chứng cụ thể cho cả ba tác phẩm; nguồn và tài liệu tham khảo tương đối đầy đủ; ít lỗi chính tả.", "Dẫn chứng còn hạn chế; một số nguồn chưa rõ; tài liệu tham khảo chưa đầy đủ; có một số lỗi chính tả.", "Dẫn chứng mờ nhạt; thiếu nguồn hoặc thiếu tài liệu tham khảo.", "Không có dẫn chứng cụ thể, không ghi nguồn, nhiều lỗi chính tả."]], ["1.4", "Giải thích chi tiết → yếu tố → tác dụng → chủ đề", 1, ["Giải thích thuyết phục mối liên hệ giữa chi tiết, yếu tố nghệ thuật, cách biểu đạt và chủ đề ở cả ba tác phẩm.", "Giải thích tương đối rõ cách các yếu tố nghệ thuật thể hiện chủ đề.", "Thiên về mô tả hoặc tóm tắt; phần giải thích còn ít.", "Chủ yếu kể lại nội dung, rất ít giải thích.", "Không làm rõ tác phẩm thể hiện chủ đề như thế nào."]], ["2.1", "So sánh giống/khác và lý giải theo đặc trưng loại hình", 1.75, ["So sánh rõ, có chiều sâu; lý giải điểm giống và khác bằng đặc trưng từng loại hình; chỉ ra khác biệt trải nghiệm và cách các tiếp cận bổ sung nhau.", "Chỉ ra được điểm giống và khác; giải thích được một số nguyên nhân của sự khác biệt.", "Có so sánh nhưng còn thiên về liệt kê; giải thích nguyên nhân hạn chế.", "So sánh sơ sài, gần như đặt ba tác phẩm cạnh nhau.", "Không so sánh; ba tác phẩm trình bày rời rạc."]], ["2.2", "Quan điểm nhóm", 1.25, ["Quan điểm rõ ràng, lập luận chặt, dựa trên dẫn chứng và kết quả phân tích, không chỉ dựa trên sở thích.", "Quan điểm rõ và có cơ sở từ phần phân tích.", "Nhận định còn chung chung hoặc chưa gắn chặt với phần phân tích.", "Quan điểm chủ yếu theo sở thích cá nhân.", "Thiếu quan điểm hoặc không có cơ sở."]], ["3.1", "Slide", 1.5, ["Slide rõ ràng, trực quan, thẩm mỹ; tích hợp hình ảnh/video/âm thanh phù hợp để minh hoạ và phân tích.", "Slide rõ ràng, có tư liệu hỗ trợ, bố cục ổn.", "Slide còn nhiều chữ hoặc tư liệu trực quan chưa hiệu quả.", "Chủ yếu là văn bản, tư liệu trực quan rất ít.", "Gần như không có hình ảnh/tư liệu, khó theo dõi."]], ["3.2", "Thuyết trình, phối hợp, thời lượng", 1.25, ["Tự tin, mạch lạc, không đọc nguyên văn slide; hai bạn phối hợp tốt; đúng 12-15 phút.", "Mạch lạc, phối hợp tốt, thời lượng phù hợp.", "Còn phụ thuộc vào việc đọc slide hoặc phối hợp chưa đồng đều.", "Chủ yếu đọc slide, thiếu chuẩn bị.", "Không đáp ứng thời lượng hoặc phối hợp; thiếu chuẩn bị."]]];

function f2(v){return String(Math.round(v*100)/100).replace(".",",")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function nrm(s){return String(s).toLowerCase().replace(/đ/g,"d").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()}
var ST=[],byName={};
Object.keys(D).forEach(function(m){var n=nrm(D[m].name);if(!byName[n]){byName[n]={name:D[m].name,ms:[],p:D[m],g:null};ST.push(byName[n])}byName[n].ms.push(m)});
Object.keys(PRES).forEach(function(id){PRES[id].m.forEach(function(nm){var n=nrm(nm);if(!byName[n]){byName[n]={name:nm,ms:[],p:null,g:null};ST.push(byName[n])}byName[n].g=id})});
function pTab(s){
 var h='<div class="tiles">';
 PG.forEach(function(g){h+='<div class="tile" style="--c:var('+g[2]+');--ct:var('+g[3]+')"><small>'+g[7]+'Nhóm tiêu chí '+g[1].charAt(0)+'</small><b>'+f2(s[PK[g[0]]])+'</b><span> / '+f2(g[4])+'</span></div>'});
 h+='</div>';
 PG.forEach(function(g){
  h+='<section class="sec" style="--c:var('+g[2]+');--ct:var('+g[3]+')"><h3><span>'+g[1]+'</span><em>'+f2(s[PK[g[0]]])+' / '+f2(g[4])+'</em></h3>';
  s.it.slice(g[5],g[6]).forEach(function(it){var lost=it.s<1;
   h+='<div class="it'+(lost?' lost':'')+'"><span class="cd">'+it.c+'</span><span class="nm">'+esc(it.n)+'<span class="ds">Chấm: '+esc(CD[+it.c.slice(2)-1])+'</span></span><span class="sc">'+f2(it.s)+' / 1</span><span class="fb">'+(lost?'':'✓ ')+esc(it.f)+'</span></div>'});
  h+='</section>'});
 h+='<div class="cm"><h3>Nhận xét của giảng viên</h3><p>'+esc(s.fb)+'</p></div>';
 h+='<div class="sum"><span>A '+f2(s.sa)+' + B '+f2(s.sb)+' + C '+f2(s.sc)+'</span><b>Điểm cuối: '+f2(s.fin)+' / 10</b></div>';
 return h}
function gTab(g){
 var h='<div class="topic"><b>Chủ đề nhóm:</b> '+esc(g.th)+'<ul>'+g.w.map(function(x){return'<li>'+esc(x)+'</li>'}).join("")+'</ul></div>';
 h+='<div class="tiles">';GS.forEach(function(s,k){h+='<div class="tile" style="--c:var('+s[1]+');--ct:var('+s[2]+')"><small>'+s[4]+esc(s[0].split(". ")[0])+'</small><b>'+f2(g.sec[k])+'</b><span> / '+f2(s[3])+'</span></div>'});h+='</div>';
 GS.forEach(function(s,k){
  h+='<section class="sec" style="--c:var('+s[1]+');--ct:var('+s[2]+')"><h3><span>'+esc(s[0])+'</span><em>'+f2(g.sec[k])+' / '+f2(s[3])+'</em></h3>';
  g.it.forEach(function(it,i){if(it.g!==k)return;var lost=it.s<it.m,d=SC[i][3];
   h+='<div class="it'+(lost?' lost':'')+'"><span class="cd">'+it.c+'</span><span class="nm">'+esc(it.n)+'</span><span class="sc">'+f2(it.s)+' / '+f2(it.m)+'</span>';
   h+='<span class="q"><b>Chấm:</b> '+esc(it.q)+'</span>';
   h+='<span class="fb">'+(lost?'':'✓ ')+esc(it.f)+'</span>';
   if(it.cap)h+='<span class="cap">'+esc(it.cap)+'.</span>';
   h+='</div>'});
  h+='</section>'});
 h+='<div class="cm"><h3>Nhận xét chung</h3><p>'+esc(g.fin)+'</p></div>';
 h+='<div class="sum"><span>Phần 1 '+f2(g.sec[0])+' + Phần 2 '+f2(g.sec[1])+' + Phần 3 '+f2(g.sec[2])+'</span><b>Điểm cuối: '+f2(g.tot)+' / 10</b></div>';
 return h}
function render(st,m,tab){
 var out=document.getElementById("out"),p=st.p,g=st.g?PRES[st.g]:null;
 tab=tab||(p?"p":"g");
 var h='<div class="stack"><div class="who"><h2>'+esc(st.name)+'</h2><p>MSSV '+esc(m||st.ms[st.ms.length-1]||"")+(g?' · Nhóm '+g.nh+' ('+esc(g.sh)+')':'')+'</p></div>';
 h+='<div class="two">';
 h+='<button type="button" class="col'+(tab==="p"?' on':'')+'" data-t="p" style="--c:var(--red);--ct:var(--red)"><span class="lb">'+ICO.user+'Bài tập cá nhân (20%)</span><div class="num">'+(p?f2(p.fin):'-')+'<span> / 10</span></div><span class="sub">Bài thu hoạch cá nhân</span><span class="see">'+(tab==="p"?'Đang xem chi tiết':'Xem chi tiết')+'</span></button>';
 h+='<button type="button" class="col'+(tab==="g"?' on':'')+'" data-t="g" style="--c:var(--cam);--ct:var(--camt)"><span class="lb">'+ICO.grp+'Thuyết trình nhóm</span><div class="num">'+(g?f2(g.tot):'-')+'<span> / 10</span></div><span class="sub">'+(g?'Điểm chung của nhóm '+g.nh:'Chưa có điểm')+'</span><span class="see">'+(tab==="g"?'Đang xem chi tiết':'Xem chi tiết')+'</span></button>';
 h+='</div>';
 if(tab==="p")h+=p?pTab(p):'<div class="msg">SV chưa có điểm bài thu hoạch cá nhân.</div>';
 else h+=g?gTab(g):'<div class="msg">SV chưa có điểm thuyết trình nhóm.</div>';
 h+='</div>';
 out.innerHTML=h;
 Array.prototype.forEach.call(out.querySelectorAll(".col"),function(b){b.onclick=function(){render(st,m,b.getAttribute("data-t"));var c=document.querySelector(".col.on");if(c&&c.scrollIntoView)c.scrollIntoView({block:"start",behavior:"smooth"})}});
}
function show(v){
 var out=document.getElementById("out"),raw=(v||"").trim();
 if(!raw){out.innerHTML='<div class="msg">Nhập MSSV hoặc họ tên rồi bấm "Tra điểm" để xem điểm bài tập cá nhân và điểm thuyết trình nhóm cùng nhận xét từng tiêu chí.</div>';return}
 var d=raw.replace(/\D/g,"");
 if(d.length>=6){var hit=ST.filter(function(s){return s.ms.indexOf(d)>=0})[0];if(hit){render(hit,d);return}}
 var q=nrm(raw).split(" ").filter(Boolean),hits=[];
 if(q.length&&!d){ST.forEach(function(s){var t=nrm(s.name).split(" ");
   var ok=q.every(function(w){return t.indexOf(w)>=0});
   if(ok&&(q.length>=2||t[t.length-1]===q[0]))hits.push(s)})}
 if(hits.length===1){render(hits[0]);return}
 if(hits.length>1){out.innerHTML='<div class="msg">Có nhiều kết quả, SV chọn đúng tên của mình:<div class="pick">'+hits.map(function(h,i){return'<button type="button" data-i="'+i+'">'+esc(h.name)+'</button>'}).join("")+'</div></div>';
  Array.prototype.forEach.call(out.querySelectorAll("button"),function(b){b.onclick=function(){render(hits[+b.getAttribute("data-i")])}});return}
 out.innerHTML='<div class="msg">Không tìm thấy <b>'+esc(raw)+'</b>, hoặc điểm chưa được công bố. SV kiểm tra lại MSSV, nhập đầy đủ họ tên (ví dụ: Nguyễn Thanh Vy) hoặc liên hệ giảng viên.</div>';
}
(function(){var q=document.getElementById("q"),f=document.getElementById("f"),b=f.querySelector("button");
function go(e){if(e&&e.preventDefault)e.preventDefault();show(q.value);return false}
f.onsubmit=go;b.onclick=go;q.onkeyup=function(e){if(e.key==="Enter"||e.keyCode===13)go(e);else if(q.value.replace(/\D/g,"").length>=9)show(q.value)};})();
show("");
</script>

</body>
</html>
